{% extends 'base.html' %}

{% block title %}重置链接已发送{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card">
            <div class="card-header bg-success text-white">
                <h4 class="mb-0"><i class="fas fa-check-circle"></i> 重置链接已发送</h4>
            </div>
            <div class="card-body text-center">
                <div class="mb-4">
                    <i class="fas fa-envelope-open-text fa-5x text-success"></i>
                </div>
                
                <h5 class="mb-3">密码重置链接已发送到您的邮箱</h5>
                
                <p class="text-muted mb-4">
                    我们已向您的邮箱发送了密码重置链接。请检查您的邮箱（包括垃圾邮件文件夹），并按照邮件中的说明重置密码。
                </p>
                
                <div class="alert alert-info">
                    <i class="fas fa-info-circle"></i>
                    <strong>重要提示：</strong>
                    <ul class="mb-0 mt-2 text-start">
                        <li>重置链接将在24小时后失效</li>
                        <li>如果您没有收到邮件，请检查垃圾邮件文件夹</li>
                        <li>请确保输入的邮箱地址正确</li>
                    </ul>
                </div>
                
                <div class="d-grid gap-2">
                    <a href="{% url 'login' %}" class="btn btn-primary">
                        <i class="fas fa-sign-in-alt"></i> 返回登录
                    </a>
                    <a href="{% url 'password_reset' %}" class="btn btn-outline-secondary">
                        <i class="fas fa-redo"></i> 重新发送链接
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
