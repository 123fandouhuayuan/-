version: '3.8'

services:
  web:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./staticfiles:/app/staticfiles
      - ./media:/app/media
    depends_on:
      - db
    restart: always

  db:
    image: dameng/dameng:latest
    ports:
      - "5236:5236"
    environment:
      - DM_USER=SYSDBA
      - DM_PASSWORD=${DB_PASSWORD}
    volumes:
      - dameng_data:/dm8/data
    restart: always

  nginx:
    image: nginx:latest
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
      - ./staticfiles:/var/www/static
      - ./media:/var/www/media
    depends_on:
      - web
    restart: always

volumes:
  dameng_data:
